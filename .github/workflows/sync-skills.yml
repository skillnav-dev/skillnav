name: Sync Skills

# ClawHub sync was removed on 2026-08-23. The upstream `openclaw/skills` repo was
# deleted, leaving all 9252 synced rows as dead links, and the replacement registry
# API exposes a 68k+ catalog with a ~24% permanently-409 rate — too large for CI and
# too low-quality to be worth curating. Those rows were backed up and dropped from
# the DB; see docs/adr/ for the decision record.

on:
  schedule:
    - cron: "0 2 * * 1" # UTC 02:00 Monday = Beijing 10:00
  workflow_dispatch:
    inputs:
      limit:
        description: "Max items to process"
        required: false
      dry_run:
        description: "Dry run mode"
        type: boolean
        default: false

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  anthropic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Sync Anthropic skills
        run: |
          ARGS=""
          if [ "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/sync-anthropic-skills.mjs $ARGS

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ *Sync Skills (Anthropic)* failed\\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
