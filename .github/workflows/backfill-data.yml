name: Backfill Data Quality

on:
  schedule:
    # Run daily at 05:00 UTC (after other sync jobs finish)
    - cron: "0 5 * * 3" # UTC 05:00 Wednesday = CST 13:00, weekly data quality day
  workflow_dispatch:
    inputs:
      tasks:
        description: "Tasks to run (comma-separated: name-zh,tags,mcp-desc-zh,mcp-reclassify,editor-comments,permissions; manual only: skill-paths, skill-paths-apply)"
        required: false
        default: "name-zh,tags,mcp-desc-zh,mcp-reclassify,editor-comments,permissions"
        type: string
      skill_slugs:
        description: "Only write Chinese name + description for these skill slugs, any status (comma-separated). Other tasks are skipped when set."
        required: false
        type: string
      mcp_slugs:
        description: "Only write Chinese description for these MCP slugs, any tier/status (comma-separated). Other tasks are skipped when set."
        required: false
        type: string

concurrency:
  group: backfill-data
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_PROVIDER: deepseek
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Determine tasks
        id: tasks
        run: |
          if [ -n "${{ inputs.skill_slugs }}" ]; then
            echo "run=skill-slugs" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.mcp_slugs }}" ]; then
            echo "run=mcp-slugs" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run=name-zh,tags,mcp-desc-zh,mcp-reclassify,editor-comments,permissions" >> "$GITHUB_OUTPUT"
          else
            echo "run=${{ inputs.tasks }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Chinese name + description for specific skills
        if: steps.tasks.outputs.run == 'skill-slugs'
        run: |
          node scripts/backfill-skills-name-zh.mjs --apply --slugs "${{ inputs.skill_slugs }}"
          node scripts/generate-skill-descriptions.mjs --apply --slugs "${{ inputs.skill_slugs }}"

      - name: Chinese description for specific MCP servers
        if: steps.tasks.outputs.run == 'mcp-slugs'
        run: node scripts/backfill-mcp-description-zh.mjs --apply --slugs "${{ inputs.mcp_slugs }}"

      - name: Point skills at their own folder (dry run)
        if: contains(steps.tasks.outputs.run, 'skill-paths') && !contains(steps.tasks.outputs.run, 'skill-paths-apply')
        run: node scripts/backfill-skill-source-paths.mjs

      - name: Point skills at their own folder
        if: contains(steps.tasks.outputs.run, 'skill-paths-apply')
        run: node scripts/backfill-skill-source-paths.mjs --apply

      - name: Backfill skills name_zh
        if: contains(steps.tasks.outputs.run, 'name-zh')
        run: node scripts/backfill-skills-name-zh.mjs --apply || true

      - name: Backfill skills tags
        if: contains(steps.tasks.outputs.run, 'tags')
        run: node scripts/backfill-skills-tags.mjs --apply || true

      - name: Backfill MCP description_zh
        if: contains(steps.tasks.outputs.run, 'mcp-desc-zh')
        run: node scripts/backfill-mcp-description-zh.mjs --apply || true

      - name: Reclassify remaining MCP "other"
        if: contains(steps.tasks.outputs.run, 'mcp-reclassify')
        run: node scripts/reclassify-all.mjs --mcp-only --llm-assist || true

      - name: Backfill editor comments
        if: contains(steps.tasks.outputs.run, 'editor-comments')
        run: node scripts/backfill-editor-comments.mjs --type all || true

      # Drafts only: entries stay hidden until approved in /admin/permissions
      - name: Draft permission boundaries for new listings
        if: contains(steps.tasks.outputs.run, 'permissions')
        run: node scripts/generate-permissions.mjs --apply || true

      - name: Notify Slack on failure
        if: failure() || cancelled()
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Backfill Data Quality had failures\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
